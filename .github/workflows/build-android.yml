name: Build & Publish TunnelX Android Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Production Signed TunnelX.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tunnelx-client source via Deploy Key
        uses: actions/checkout@v4
        with:
          repository: ZazaFather/tunnelx-client
          ssh-key: ${{ secrets.CLIENT_DEPLOY_KEY }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android SDK Platform 34 & libv2ray.aar
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          mkdir -p android/app/libs
          curl -fsSL "https://github.com/ZazaFather/tunnelx-releases/releases/download/v2.6.5/libv2ray.aar" -o android/app/libs/libv2ray.aar

      - name: Prepare Android Native Assets Directory
        run: |
          mkdir -p android/app/src/main/assets

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "${ANDROID_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/tunnelx-release.p12"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/tunnelx-release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TunnelX.apk

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/tunnelx-release.p12"

      - name: Publish Signed TunnelX.apk to Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo ZazaFather/tunnelx-releases --json tagName -q .tagName 2>/dev/null || echo "v2.6.5")
          gh release upload "${TAG}" android/app/build/outputs/apk/release/TunnelX.apk --repo ZazaFather/tunnelx-releases --clobber

      - name: Upload TunnelX.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunnelX-Android-v2.6.5
          path: android/app/build/outputs/apk/release/TunnelX.apk
          retention-days: 30
