name: Build & Publish TunnelX Apple (iOS AppStore + macOS Notarized DMG)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apple.yml'

permissions:
  contents: write

jobs:
  build-apple:
    name: Build iOS AppStore IPA & Notarized macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout tunnelx-client source via Deploy Key
        uses: actions/checkout@v4
        with:
          repository: ZazaFather/tunnelx-client
          ssh-key: ${{ secrets.CLIENT_DEPLOY_KEY }}

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Build, Sign, Notarize & Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PRIVATE_KEY_PEM: ${{ secrets.APPLE_PRIVATE_KEY_PEM }}
          APPLE_DIST_CERT_B64: ${{ secrets.APPLE_DIST_CERT_B64 }}
          APPLE_DEVID_CERT_B64: ${{ secrets.APPLE_DEVID_CERT_B64 }}
          APPLE_PROVISION_MAIN_B64: ${{ secrets.APPLE_PROVISION_MAIN_B64 }}
          APPLE_PROVISION_EXT_B64: ${{ secrets.APPLE_PROVISION_EXT_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          chmod +x ./apple/scripts/build_xcframeworks.sh ./apple/scripts/build_all_apple.sh
          ./apple/scripts/build_all_apple.sh

      - name: Publish Notarized TunnelX-macOS.dmg to v2.6.3 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v2.6.3 artifacts-apple/TunnelX-macOS.dmg --repo ZazaFather/tunnelx-releases --clobber

      - name: Upload Apple Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TunnelX-Apple-v2.6.3
          path: |
            artifacts-apple/TunnelX-iOS.ipa
            artifacts-apple/TunnelX-macOS.dmg
          retention-days: 30
